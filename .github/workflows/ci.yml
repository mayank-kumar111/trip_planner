name: CI

# This is the single repository quality gate used before release.
# It intentionally runs runtime security, type, test, documentation, and build checks.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Runtime dependency security audit
        run: npm run audit

      - name: Full dependency audit (informational)
        run: npm run audit:full
        continue-on-error: true

      - name: Documentation coverage
        run: npm run docs:check

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build
        env:
          NEXT_PUBLIC_CONVEX_URL: https://example.invalid
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_ZXhhbXBsZS5jbGVyay5hY2NvdW50cy5kZXYk
          CLERK_SECRET_KEY: sk_test_ci_placeholder
          CLERK_JWT_ISSUER_DOMAIN: https://example.invalid
          GEMINI_API_KEY: ci-placeholder
          ARCJET_KEY: ci-placeholder
          GOOGLE_PLACE_API_KEY: ci-placeholder
          GOOGLE_ROUTES_API_KEY: ci-placeholder
          NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ci-placeholder
          NEXT_PUBLIC_ENABLE_GOOGLE_MAPS: "false"
